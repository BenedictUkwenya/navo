version: '3.8'

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    volumes:
      - .:/app
      - /app/node_modules
    environment:
      - NODE_ENV=development
      - CHOKIDAR_USEPOLLING=true
      - REACT_APP_EXPO_API_KEY=${REACT_APP_EXPO_API_KEY}
      - REACT_APP_API_BASE_URL=${REACT_APP_API_BASE_URL}
    command: npm start